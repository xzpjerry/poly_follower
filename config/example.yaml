leader_profile_wallet: "0x0000000000000000000000000000000000000000"
follower_profile_wallet: null
simulate_empty_follower: true

scope:
  # Dynamic daily discovery: Series slug + today/tomorrow/YYYY-MM-DD.
  series_slug: "replace-with-gamma-series-slug"
  event_date: "today"
  timezone: "Asia/Hong_Kong"
  # Alternatively, remove the three fields above and pin one exact Event:
  # event_slug: "replace-with-exact-gamma-event-slug"
  include_yes_tokens: true
  include_no_tokens: true

copy:
  share_ratio: "0.25"
  sync_existing_positions_on_start: true

risk:
  max_open_debit_usd: "5.00"
  max_event_loss_usd: "5.00"

monitoring:
  activity_poll_ms: 1500
  activity_overlap_seconds: 10
  full_reconcile_seconds: 15
  request_timeout_ms: 10000

execution:
  mode: "dry-run"
  # Set this to the wallet's verified CLOB type: EOA=0, Proxy=1, Safe=2, Deposit/POLY_1271=3.
  signature_type: 3
  # Live mode intentionally executes at most one FOK order, then reconciles again.
  max_orders_per_cycle: 1
  max_signal_age_seconds: 30
  max_price_drift_abs: "0.02"
  max_slippage_bps: 300
  max_book_age_ms: 2000
  stop_before_end_seconds: 120
  # An accepted order remains fail-closed until CONFIRMED/FAILED/CANCELLATION.
  terminal_timeout_seconds: 180

alerts:
  pushover:
    # Required in live mode. Credentials are loaded only from *_FILE runtime secrets.
    enabled: false
    request_timeout_ms: 10000
    emergency_retry_seconds: 30
    emergency_expire_seconds: 3600
    dedupe_seconds: 300

safety:
  # Either this file or the persistent SQLite flag blocks all new live orders.
  kill_switch_path: "data/LIVE_TRADING_DISABLED"
  user_stream_unhealthy_seconds: 60

state:
  database_path: "data/state.sqlite"
